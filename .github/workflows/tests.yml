name: Mini Utopia Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall studio app.py

      - name: Smoke-test production imports
        run: |
          python -c "from studio.models.character import CharacterProfile, EyeProfile, WearableLoadout"
          python -c "from studio.models.reference import ReferenceCharacterConfig"
          python -c "from studio.core.enums import AssetType; assert AssetType.WEARABLE.value == 'wearable'"

      - name: Run tests
        run: python -m pytest -q


  godot-parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          curl -L -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Parse Godot project headlessly
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit

      - name: Smoke-test Mini Utopia Bridge from Godot
        run: |
          python3 -m studio.bridge.server --port 8765 > /tmp/mini-utopia-bridge.log 2>&1 &
          BRIDGE_PID=$!
          cleanup() {
            kill "$BRIDGE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          python3 - <<'PY'
          import time
          import urllib.request

          deadline = time.monotonic() + 5.0
          last_error = None
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:8765/health",
                      timeout=0.5,
                  ) as response:
                      assert response.status == 200
                      break
              except Exception as exc:
                  last_error = exc
                  time.sleep(0.1)
          else:
              raise RuntimeError(
                  f"Bridge did not become ready: {last_error}"
              )
          PY

          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/bridge_health_smoke.gd

      - name: Smoke-test Bridge Character contract in Godot
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/bridge_character_contract_smoke.gd

      - name: Smoke-test Bridge Character write from Godot
        run: |
          PYTHONPATH=. python3 tests/bridge_godot_write_smoke_server.py > /tmp/bridge-write-smoke.log 2>&1 &
          BRIDGE_PID=$!
          cleanup() {
            kill "$BRIDGE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          python3 - <<'PY'
          import time
          import urllib.request

          deadline = time.monotonic() + 5.0
          last_error = None
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:8765/health",
                      timeout=0.5,
                  ) as response:
                      assert response.status == 200
                      break
              except Exception as exc:
                  last_error = exc
                  time.sleep(0.1)
          else:
              raise RuntimeError(
                  f"Bridge write smoke server did not become ready: {last_error}"
              )
          PY

          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/bridge_character_write_smoke.gd

      - name: Smoke-test Character Creator shell
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/character_creator_shell_smoke.gd

      - name: Smoke-test persistent Character Creator Avatar stage
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/character_creator_avatar_stage_smoke.gd

      - name: Smoke-test instant Character Creator look controls
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/character_creator_look_controls_smoke.gd

      - name: Smoke-test nullable Equipment runtime
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/equipment_runtime_null_smoke.gd

      - name: Smoke-test deferred Baby follow runtime
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/baby_follow_spawn_smoke.gd

      - name: Smoke-test generic Quest runtime
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/quest_runtime_smoke.gd

      - name: Smoke-test reusable World gameplay runtime
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/world_gameplay_runtime_smoke.gd

      - name: Smoke-test Creative World decoration runtime
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/world_creative_runtime_smoke.gd

      - name: Smoke-test Godot Director Shot runtime
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/director_shot_runtime_smoke.gd

      - name: Smoke-test launchable Director Stage scene
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/director_stage_scene_smoke.gd

      - name: Smoke-test Director bound World loading
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/director_bound_world_smoke.gd

      - name: Smoke-test Director Shot blocking
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/director_shot_blocking_smoke.gd

      - name: Smoke-test Director Camera Motion
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/director_camera_motion_smoke.gd

      - name: Smoke-test Director Performance Cues
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/director_performance_cue_smoke.gd

      - name: Smoke-test Storyboard PNG capture
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          play = json.loads(
              Path("godot/config/runtime/creator_play_session_example.json")
              .read_text(encoding="utf-8")
          )
          request = {
              "schema_version": "1.0",
              "output_path": "res://runtime_state/storyboards/EP_SMOKE/SHOT_01_01.png",
              "capture_time_seconds": 1.0,
              "director_session": {
                  "schema_version": "1.0",
                  "director_session_id": "DIR_STORYBOARD_SMOKE",
                  "source_fingerprint": "SMOKE_FINGERPRINT",
                  "episode_id": "EP_SMOKE",
                  "scene_id": "SCENE_01",
                  "shot_id": "SHOT_01_01",
                  "story_id": "STORY_SMOKE",
                  "world_asset_id": play.get("world_asset_id"),
                  "character_asset_id": play["character_asset_id"],
                  "scene_title": "Storyboard Smoke",
                  "story_beat": "ARRIVE",
                  "duration_seconds": 2.0,
                  "animation_intent": "walk",
                  "camera": {
                      "position": [0.0, 4.2, 7.8],
                      "look_at": [0.0, 1.1, 0.0],
                      "fov": 52.0,
                      "movement": "Wide establishing · gentle push-in",
                      "end_position": [0.0, 3.8, 6.2],
                      "end_look_at": [0.0, 1.1, -0.5],
                      "end_fov": 48.0,
                      "movement_mode": "push_in",
                      "easing": "smooth"
                  },
                  "shot": {
                      "shot_id": "SHOT_01_01",
                      "scene_id": "SCENE_01",
                      "duration_seconds": 2.0,
                      "asset_ids": [play["character_asset_id"]],
                      "shot_type": "Establishing",
                      "camera": "Wide establishing",
                      "action": "Walk into frame.",
                      "expression": "curious",
                      "dialogue": [],
                      "continuity_notes": [],
                      "blocking": {
                          "actor_start": {"x": 0.0, "y": 0.0, "z": 2.0},
                          "actor_end": {"x": 0.0, "y": 0.0, "z": 0.0},
                          "facing_degrees": 180.0,
                          "baby_offset": {"x": -0.8, "y": 0.0, "z": 1.0},
                          "movement_style": "walk",
                          "source": "generated",
                          "confidence": 1.0
                      },
                      "camera_motion": None,
                      "performance_cues": []
                  },
                  "play_session": play
              }
          }
          target = Path("godot/runtime_state/storyboard_capture_request.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(request, indent=2), encoding="utf-8")
          PY
          xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --path godot --rendering-method gl_compatibility --resolution 960x540 --script res://scripts/storyboard_capture.gd
          python3 - <<'PY'
          from pathlib import Path
          path = Path("godot/runtime_state/storyboards/EP_SMOKE/SHOT_01_01.png")
          assert path.exists() and path.stat().st_size > 8
          assert path.read_bytes()[:8] == b"\x89PNG\r\n\x1a\n"
          print("storyboard_capture_smoke: PASS · PNG created")
          PY

      - name: Smoke-test approved Shot MP4 capture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          python3 - <<'PY'
          import json
          from pathlib import Path

          storyboard = json.loads(
              Path("godot/runtime_state/storyboard_capture_request.json")
              .read_text(encoding="utf-8")
          )
          request = {
              "schema_version": "1.0",
              "output_dir": "res://runtime_state/shot_frames/EP_SMOKE/SHOT_01_01",
              "fps": 6,
              "frame_count": 6,
              "width": 480,
              "height": 270,
              "director_session": storyboard["director_session"],
          }
          target = Path("godot/runtime_state/shot_capture_request.json")
          target.write_text(json.dumps(request, indent=2), encoding="utf-8")
          PY
          xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --path godot --rendering-method gl_compatibility --resolution 480x270 --script res://scripts/shot_frame_capture.gd
          test "$(find godot/runtime_state/shot_frames/EP_SMOKE/SHOT_01_01 -name 'frame_*.png' | wc -l)" -eq 6
          mkdir -p godot/runtime_state/renders/EP_SMOKE
          ffmpeg -hide_banner -loglevel error -y -framerate 6 -i godot/runtime_state/shot_frames/EP_SMOKE/SHOT_01_01/frame_%05d.png -c:v libx264 -pix_fmt yuv420p -movflags +faststart godot/runtime_state/renders/EP_SMOKE/SHOT_01_01.mp4
          python3 - <<'PY'
          from pathlib import Path
          path = Path("godot/runtime_state/renders/EP_SMOKE/SHOT_01_01.mp4")
          assert path.exists() and path.stat().st_size > 32
          assert b"ftyp" in path.read_bytes()[:32]
          print("shot_video_capture_smoke: PASS · MP4 created")
          PY
