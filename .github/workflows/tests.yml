              PrivateFamilyRenderQueue, PrivateRenderQueueError,
          )
          from studio.repositories.sqlite import SQLiteStudioRepository

          # Only synthetic children, actors, draft and MP4 are used here.
          # Test real Godot 4.7.2/Xvfb/FFmpeg in a private /tmp tree.
          with tempfile.TemporaryDirectory(prefix="ci-fake-family-", dir="/tmp") as temp:
              base = Path(temp)
              db = base / "synthetic.db"
              store = base / "private-movies"
              store.mkdir(mode=0o700)
              adult = "ci_synthetic_parent_unlock_0123456789abcdef"
              ca = "ci-synthetic-child-a"
              cb = "ci-synthetic-child-b"
              origin = "https://family.example"
              app = FamilyApplication(
                  SQLiteStudioRepository(db),
                  token_hashes={
                      "child_a": hashlib.sha256(ca.encode()).hexdigest(),
                      "child_b": hashlib.sha256(cb.encode()).hexdigest(),
                  },
                  parent_unlock_hash=hashlib.sha256(adult.encode()).hexdigest(),
                  allowed_origins=(origin,),
                  private_movie_root=store,
              )

              def api(method, path, payload=None, token=ca):
                  return app.handle(
                      method=method, path=path,
                      authorization="Bearer " + token, origin=origin,
                      body=json.dumps(payload).encode() if payload is not None else b"",
                  )

              hero = api("POST", "/characters", {
                  "display_name": "Synthetic Cloud Sheep"
              })
              assert hero.status == 201
              cid = hero.payload["character_id"]
              prop = api("POST", f"/characters/{cid}/crafted-props", {
                  "schema_version": "1.0",
                  "display_name": "Synthetic Mint Star",
                  "shape": "star", "slot": "weapon_main",
                  "color_hex": "#B9E7D0", "accent_color_hex": "#F2C75C",
              })
              assert prop.status == 201
              item_id = prop.payload["crafted"]["item_instance_id"]
              assert api("PUT", f"/characters/{cid}/equipment/weapon_main", {
                  "item_instance_id": item_id
              }).status == 200

              draft = {
                  "schema_version": "1.0", "display_name": "Synthetic Cloud Story",
                  "character_id": cid, "camera": "wide", "action": "walk",
                  "duration_seconds": 15, "caption_preset": "hello",
                  "private_story_note": "PRIVATE CHILD NOTES MUST NEVER APPEAR",
              }
              saved = api("POST", "/family/films", draft)
              assert saved.status == 201
              film_id = saved.payload["film_id"]
              choice = {
                  "profile_id": "child_a", "film_id": film_id,
                  "revision": saved.payload["revision"],
              }
              release_uri = "/family/movie-releases"
              download_uri = f"/family/films/{film_id}/download"
              queue = PrivateFamilyRenderQueue(db)
              try:
                  queue.enqueue(owner="child_a", film_id=film_id, fps=2)
              except PrivateRenderQueueError:
                  pass
              else:
                  raise AssertionError("Private queue accepted an unapproved film")
              assert api("POST", release_uri, {**choice, "decision": "release"},
                         token=adult).status == 409
              review = api("POST", "/family/film-reviews", {
                  **choice, "decision": "approve"
              }, token=adult)
              assert review.status == 200
              assert review.payload["approved_for_private_render"] is True
              assert api("POST", release_uri, {**choice, "decision": "release"},
                         token=adult).status == 409
              fp = approved_fingerprint(
                  app.repository, owner="child_a", film_id=film_id
              )
              assert fp and len(fp) == 64
              from studio.family_film_render import build_family_film_render_source
              source = build_family_film_render_source(
                  app.repository, owner="child_a", film_id=film_id
              )
              assert source["director_choices"]["caption_preset"] == "hello"
              assert "PRIVATE CHILD NOTES" not in json.dumps(source)
              try:
                  queue.enqueue(owner="child_b", film_id=film_id, fps=2)
              except PrivateRenderQueueError:
                  pass
              else:
                  raise AssertionError("Sibling may not enqueue another child's film")
              job = queue.enqueue(owner="child_a", film_id=film_id, fps=2)
              assert job["status"] == "queued"
              assert job["fingerprint"] == fp
              assert queue.enqueue(
                  owner="child_a", film_id=film_id, fps=2
              )["job_id"] == job["job_id"], "Queue requests must be idempotent"
              assert queue.list_jobs(owner="child_b") == []
              assert app.private_mp4_for_download(
                  authorization="Bearer " + ca, film_id=film_id, origin=origin
              ) is None

              # This calls the REAL isolated Godot/Xvfb/FFmpeg renderer through
              # SQLite's adult-only queue, not a stub or direct worker shortcut.
              result = queue.run_one(
                  project_dir=Path("godot"), store_root=store,
                  godot="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64",
                  ffmpeg="ffmpeg", ffprobe="ffprobe", xvfb_run="xvfb-run",
              )
              assert result and result["status"] == "completed"
              assert result["job_id"] == job["job_id"]
              assert result["attempts"] == 1
              assert queue.run_one(
                  project_dir=Path("godot"), store_root=store,
              ) is None, "Completed private render may not rerun automatically"
              restarted_queue = PrivateFamilyRenderQueue(db)
              assert restarted_queue.list_jobs(owner="child_a")[0]["status"] == "completed"
              assert restarted_queue.claim_one() is None

              output = media_path(
                  store, owner="child_a", film_id=film_id, fingerprint=fp,
              )
              assert output.is_file() and output.stat().st_mode & 0o077 == 0
              assert output.stat().st_size > 256
              duration = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                   "-of", "default=noprint_wrappers=1:nokey=1", str(output)],
                  check=True, capture_output=True, text=True,
              )
              assert abs(float(duration.stdout.strip()) - 15) < 0.6
              assert app.private_mp4_for_download(
                  authorization="Bearer " + ca, film_id=film_id, origin=origin
              ) is None, "Adult must release AFTER seeing encoded MP4"

              released = api("POST", release_uri, {
                  **choice, "decision": "release"
              }, token=adult)
              assert released.status == 200
              assert released.payload["released_to_child"] is True
              actual = app.private_mp4_for_download(
                  authorization="Bearer " + ca, film_id=film_id, origin=origin
              )
              assert actual == output.read_bytes()
              assert actual[4:8] == b"ftyp"
              assert app.private_mp4_for_download(
                  authorization="Bearer " + cb, film_id=film_id, origin=origin
              ) is None

              revoked = api("POST", release_uri, {
                  **choice, "decision": "revoke"
              }, token=adult)
              assert revoked.status == 200
              assert revoked.payload["released_to_child"] is False
              assert app.private_mp4_for_download(
                  authorization="Bearer " + ca, film_id=film_id, origin=origin
              ) is None
              assert not Path("godot/runtime_state/private-film.mp4").exists()
              print("private_film_queued_chain: PASS · parent approve → SQLite "
                    "single-worker claim → real synthetic MP4 → parent "
                    "release → owner download → revoke")
          PY
