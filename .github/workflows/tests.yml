name: Mini Utopia Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall studio app.py

      - name: Smoke-test production imports
        run: |
          python -c "from studio.models.character import CharacterProfile, EyeProfile, WearableLoadout"
          python -c "from studio.models.reference import ReferenceCharacterConfig"
          python -c "from studio.core.enums import AssetType; assert AssetType.WEARABLE.value == 'wearable'"

      - name: Run tests
        run: python -m pytest -q


  godot-parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          curl -L -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Parse Godot project headlessly
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit

      - name: Smoke-test Mini Utopia Bridge from Godot
        run: |
          python3 -m studio.bridge.server --port 8765 > /tmp/mini-utopia-bridge.log 2>&1 &
          BRIDGE_PID=$!
          cleanup() {
            kill "$BRIDGE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          python3 - <<'PY'
          import time
          import urllib.request

          deadline = time.monotonic() + 5.0
          last_error = None
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:8765/health",
                      timeout=0.5,
                  ) as response:
                      assert response.status == 200
                      break
              except Exception as exc:
                  last_error = exc
                  time.sleep(0.1)
          else:
              raise RuntimeError(
                  f"Bridge did not become ready: {last_error}"
              )
          PY

          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/bridge_health_smoke.gd

      - name: Smoke-test Bridge Character contract in Godot
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/bridge_character_contract_smoke.gd

      - name: Smoke-test Bridge Character write from Godot
        run: |
          PYTHONPATH=. python3 tests/bridge_godot_write_smoke_server.py > /tmp/bridge-write-smoke.log 2>&1 &
          BRIDGE_PID=$!
          cleanup() {
            kill "$BRIDGE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          python3 - <<'PY'
          import time
          import urllib.request

          deadline = time.monotonic() + 5.0
          last_error = None
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:8765/health",
                      timeout=0.5,
                  ) as response:
                      assert response.status == 200
                      break
              except Exception as exc:
                  last_error = exc
                  time.sleep(0.1)
          else:
              raise RuntimeError(
                  f"Bridge write smoke server did not become ready: {last_error}"
              )
          PY

          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/bridge_character_write_smoke.gd

      - name: Smoke-test Character Creator shell
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/character_creator_shell_smoke.gd

      - name: Smoke-test persistent Character Creator Avatar stage
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/character_creator_avatar_stage_smoke.gd

      - name: Smoke-test instant Character Creator look controls
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/character_creator_look_controls_smoke.gd

      - name: Smoke-test Character Creator Hair Eyes and Colors
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/character_creator_detail_controls_smoke.gd

      - name: Smoke-test Character Creator animation controls
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/character_creator_animation_controls_smoke.gd

      - name: Install equipment Bridge smoke server dependencies
        run: python3 -m pip install "pydantic>=2.8,<3"

      - name: Smoke-test Equipment Bridge nine-slot round trip
        run: |
          PYTHONPATH=. python3 tests/bridge_godot_equipment_smoke_server.py > /tmp/bridge-equipment-smoke.log 2>&1 &
          BRIDGE_PID=$!
          cleanup() {
            kill "$BRIDGE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          python3 - <<'PY'
          import time
          import urllib.request

          deadline = time.monotonic() + 5.0
          last_error = None
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:8766/health",
                      timeout=0.5,
                  ) as response:
                      assert response.status == 200
                      break
              except Exception as exc:
                  last_error = exc
                  time.sleep(0.1)
          else:
              raise RuntimeError(
                  f"Equipment Bridge smoke server did not become ready: {last_error}; "
                  + open("/tmp/bridge-equipment-smoke.log", encoding="utf-8").read()
              )
          PY

          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/bridge_equipment_roundtrip_smoke.gd

      - name: Smoke-test complete Equipment runtime synchronization
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/equipment_runtime_sync_smoke.gd

      - name: Smoke-test nullable Equipment runtime
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/equipment_runtime_null_smoke.gd

      - name: Smoke-test deferred Baby follow runtime
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/baby_follow_spawn_smoke.gd

      - name: Smoke-test generic Quest runtime
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/quest_runtime_smoke.gd

      - name: Smoke-test reusable World gameplay runtime
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/world_gameplay_runtime_smoke.gd

      - name: Smoke-test Creative World decoration runtime
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/world_creative_runtime_smoke.gd

      - name: Smoke-test Godot Director Shot runtime
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/director_shot_runtime_smoke.gd

      - name: Smoke-test launchable Director Stage scene
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/director_stage_scene_smoke.gd

      - name: Smoke-test Director bound World loading
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/director_bound_world_smoke.gd

      - name: Smoke-test Director Shot blocking
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/director_shot_blocking_smoke.gd

