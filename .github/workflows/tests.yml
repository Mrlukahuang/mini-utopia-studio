name: Mini Utopia Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall studio app.py

      - name: Smoke-test production imports
        run: |
          python -c "from studio.models.character import CharacterProfile, EyeProfile, WearableLoadout"
          python -c "from studio.models.reference import ReferenceCharacterConfig"
          python -c "from studio.core.enums import AssetType; assert AssetType.WEARABLE.value == 'wearable'"

      - name: Run tests
        run: python -m pytest -q
