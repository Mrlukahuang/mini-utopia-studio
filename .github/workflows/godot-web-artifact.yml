name: Mini Utopia - Godot Web Build

# Stage 1: cloud-built private CI artifacts only.
# Do NOT auto-deploy this public repository to GitHub Pages:
# family content needs a private, authenticated backend first.
on:
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/godot-web-artifact.yml"
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/godot-web-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: "4.7.2"
      GODOT_BINARY: "/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
      TEMPLATE_DIR: "/home/runner/.local/share/godot/export_templates/4.7.2.stable"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot
          curl --fail --location --retry 3 \
            --output /tmp/godot-editor.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot-editor.zip -d /tmp/godot
          chmod +x "$GODOT_BINARY"
          "$GODOT_BINARY" --version

      - name: Restore Web export templates (debug and release)
        id: template-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.TEMPLATE_DIR }}/web_nothreads_release.zip
            ${{ env.TEMPLATE_DIR }}/web_nothreads_debug.zip
          key: mini-utopia-godot-4.7.2-web-nothreads-pair-v2

      - name: Download official Web export templates on cache miss
        if: steps.template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TEMPLATE_DIR"
          # The upstream .tpz contains all platforms (~1.3 GB), but we
          # extract/cache only the single-threaded Web debug/release templates.
          curl --fail --location --retry 3 \
            --output /tmp/godot-templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          for kind in release debug; do
            entry="templates/web_nothreads_${kind}.zip"
            unzip -Z1 /tmp/godot-templates.tpz | grep -Fx "$entry"
            unzip -p /tmp/godot-templates.tpz "$entry" > "$TEMPLATE_DIR/web_nothreads_${kind}.zip"
            test -s "$TEMPLATE_DIR/web_nothreads_${kind}.zip"
          done

      - name: Register Godot export template version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TEMPLATE_DIR"
          printf '%s\n' '4.7.2.stable' > "$TEMPLATE_DIR/version.txt"
          for kind in release debug; do
            test -s "$TEMPLATE_DIR/web_nothreads_${kind}.zip"
            unzip -t "$TEMPLATE_DIR/web_nothreads_${kind}.zip" | tail -n 1
          done

      - name: Prepare asset imports
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --editor --quit

      # A-012: same-HEAD Web screenshots and actual mesh/bone diagnostics.
      # Runs BEFORE formal smoke; never replaces/skips it or production export.
      - name: Diagnose staff and sword in isolated Web before formal smoke
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/mini-utopia-playwright --no-audit --no-fund playwright@1.56.1
          /tmp/mini-utopia-playwright/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p dist/visual-evidence
          python3 - <<'PY'
          import os,re,subprocess
          from pathlib import Path
          pr=Path("godot/project.godot")
          shell=Path("godot/scripts/character_creator_shell.gd")
          project=pr.read_text()
          original=shell.read_text()
          anchor='    _build_save_celebration()'
          assert original.count(anchor)==1
          fixture=original.replace(anchor,anchor+'\n    call_deferred("_ci_diag_ready")',1)
          fixture+='''
          var _ci_key := ""
          func _ci_diag_ready() -> void:
              avatar_stage.apply_equipment_runtime({
                  "character_asset_id": "CHAR_CI_DIAG",
                  "equipped": {"weapon_main": {
                      "item_instance_id": "ITEM_CI_DIAG",
                      "mesh_asset_id": "staff",
                  }},
                  "final_stats": {},
              })

          func _ci_v(v: Vector3) -> Array:
              return [v.x,v.y,v.z]

          func _process(_delta: float) -> void:
              if not OS.has_feature("web"):
                  return
              var request := String(JavaScriptBridge.eval(
                  "window.__MU_REQUEST || ''",true
              ))
              if request.is_empty():
                  return
              if request != _ci_key:
                  var parts := request.split("|")
                  if parts.size() != 3:
                      return
                  _ci_key = request
                  _draft_appearance["compatible_tags"] = [
                      "humanoid", "kaykit_style_" + String(parts[0])
                  ]
                  avatar_stage.apply_appearance(_draft_appearance)
                  avatar_stage.play_preview_animation(String(parts[1]))
                  avatar_stage.avatar_root().rotation_degrees.y = float(parts[2])
                  return
              var actor := avatar_stage.avatar_root()
              var hand := actor.find_child(
                  "Equipment_weapon_main",true,false
              ) as Node3D
              var rig := actor.get_node_or_null(
                  "KayKitBody/Rig/Skeleton3D"
              ) as Skeleton3D
              if hand == null or rig == null:
                  return
              var meshes := hand.find_children(
                  "*","MeshInstance3D",true,false
              )
              if meshes.is_empty():
                  return
              var mesh := meshes[0] as MeshInstance3D
              var bone := rig.find_bone("head")
              if mesh == null or bone < 0:
                  return
              var bb := mesh.get_aabb()
              var p := Vector3(
                  bb.position.x + bb.size.x * 0.5,
                  bb.position.y + bb.size.y,
                  bb.position.z + bb.size.z * 0.5
              )
              var tip := mesh.to_global(p)
              # Only staff's actual crown vertices: no generic silhouette
              # classifier or camera-dependent rendering change. Includes the
              # green jewel AND its metal housing at the tip.
              var crown_low := Vector3(INF,INF,INF)
              var crown_high := Vector3(-INF,-INF,-INF)
              var crown_world_low := Vector3(INF,INF,INF)
              var crown_world_high := Vector3(-INF,-INF,-INF)
              var crown_screen_low := Vector2(INF,INF)
              var crown_screen_high := Vector2(-INF,-INF)
              var crown_samples := 0
              var verts := mesh.mesh.surface_get_arrays(0)[Mesh.ARRAY_VERTEX] as PackedVector3Array
              var cam := avatar_stage._camera as Camera3D
              for vertex in verts:
                  if vertex.y < 0.70:
                      continue
                  crown_samples += 1
                  crown_low = crown_low.min(vertex)
                  crown_high = crown_high.max(vertex)
                  var w := mesh.to_global(vertex)
                  crown_world_low = crown_world_low.min(w)
                  crown_world_high = crown_world_high.max(w)
                  var screen := cam.unproject_position(w)
                  crown_screen_low = crown_screen_low.min(screen)
                  crown_screen_high = crown_screen_high.max(screen)
              var head := rig.to_global(
                  rig.get_bone_global_pose(bone).origin
              )
              var axes := actor.global_transform.basis.orthonormalized()
              var d := tip-head
              var px1 := cam.unproject_position(head)
              var px2 := cam.unproject_position(tip)
              JavaScriptBridge.get_interface("window").set(
                  "__MU_DIAG_JSON",JSON.stringify({
                      "request": request,
                      "head": _ci_v(head),
                      "grip": _ci_v(hand.global_position),
                      "grip_parent": _ci_v((hand.get_parent() as Node3D).global_position),
                      "grip_basis_x": _ci_v(hand.global_transform.basis.x),
                      "grip_basis_y": _ci_v(hand.global_transform.basis.y),
                      "grip_basis_z": _ci_v(hand.global_transform.basis.z),
                      "mesh_origin": _ci_v(mesh.global_position),
                      "tip": _ci_v(tip),
                      "crown_vertex_count": crown_samples,
                      "crown_local_min": _ci_v(crown_low),
                      "crown_local_max": _ci_v(crown_high),
                      "crown_world_min": _ci_v(crown_world_low),
                      "crown_world_max": _ci_v(crown_world_high),
                      "crown_screen_min": [crown_screen_low.x,crown_screen_low.y],
                      "crown_screen_max": [crown_screen_high.x,crown_screen_high.y],
                      "axis": _ci_v(hand.global_transform.basis.y),
                      "bounds_min": _ci_v(bb.position),
                      "bounds_max": _ci_v(bb.position+bb.size),
                      "front_gap":absf(d.dot(axes.x)),
                      "side_gap":absf(d.dot(axes.z)),
                      "height":d.dot(axes.y),
                      "head_screen":[px1.x,px1.y],
                      "tip_screen":[px2.x,px2.y],
                      "screen_gap_px":px1.distance_to(px2),
                  })
              )
          '''
          shell.write_text(fixture)
          pr.write_text(re.sub(
              r'^run/main_scene=".*"$',
              'run/main_scene="res://scenes/character_creator.tscn"',
              project,count=1,flags=re.MULTILINE
          ))
          subprocess.run([os.environ["GODOT_BINARY"],"--headless","--path","godot",
              "--editor","--quit"],check=True)
          out=Path("dist/clearance-diag")
          out.mkdir(parents=True,exist_ok=True)
          subprocess.run([os.environ["GODOT_BINARY"],"--headless","--path","godot",
              "--export-release","Web",str(out.resolve()/"index.html")],check=True)
          assert (out/"index.pck").stat().st_size>0
          pr.write_text(project)
          shell.write_text(original)
          PY
          python3 -m http.server 8791 --bind 127.0.0.1 --directory dist/clearance-diag >/tmp/mu-diag.log 2>&1 &
          node <<'JS'
          const {chromium}=require('/tmp/mini-utopia-playwright/node_modules/playwright');
          const fs=require('node:fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:[
              '--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--no-sandbox'
            ]});
            const records=[];
            try{
              for(const [width,height] of [[1180,820],[1366,1024]]){
                const context=await browser.newContext({
                  viewport:{width,height},deviceScaleFactor:1,isMobile:true,hasTouch:true
                });
                const page=await context.newPage();
                await page.goto('http://127.0.0.1:8791/',{waitUntil:'load',timeout:120000});
                await page.waitForFunction(
                  ()=>document.querySelector('#loader')===null,null,{timeout:120000}
                );
                await page.waitForTimeout(1300);
                // Focused preview: only one real staff build, both sides,
                // Idle and two actual Walk phases at both iPad viewport sizes.
                for(const pose of ['Idle','Walk']){
                  for(const [view,angle] of [['side',90],['side-left',270]]){
                    const key=['staff',pose,angle].join('|');
                    await page.evaluate(x=>{window.__MU_REQUEST=x;
                      window.__MU_DIAG_JSON='';},key);
                    await page.waitForFunction(
                      x=>{try{return JSON.parse(window.__MU_DIAG_JSON||'{}').request===x;}
                      catch(e){return false;}},key,{timeout:45000});
                    for(const phase of (pose==='Walk'?['early','later']:['idle'])){
                      await page.waitForTimeout(phase==='later'?730:550);
                      const data=await page.evaluate(()=>JSON.parse(window.__MU_DIAG_JSON));
                      data.viewport=[width,height];data.pose=pose;data.view=view;data.phase=phase;
                      records.push(data);
                      const dest='dist/visual-evidence/diag-staff-'+pose+
                        '-'+view+'-'+phase+'-'+width+'x'+height+'.png';
                      await page.screenshot({path:dest,timeout:90000});
                      if(fs.statSync(dest).size<15000)throw Error('Empty Web screenshot '+dest);
                      console.log('MU_DIAG '+JSON.stringify(data));
                    }
                  }
                }
                await context.close();
              }
            }finally{await browser.close();}
            fs.writeFileSync('dist/visual-evidence/clearance-geometry.json',
              JSON.stringify(records,null,2));
            if(records.length!==12)throw Error('Only '+records.length+' focused diagnostic frames');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS

      # A-012: publish evidence even when unchanged required smoke fails later.
      - name: Upload isolated same-HEAD geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-c-454-geometry-diagnostic-HEAD
          path: |
            dist/visual-evidence/diag-*.png
            dist/visual-evidence/clearance-geometry.json
          if-no-files-found: warn
          retention-days: 14

      - name: Smoke-test iPad touch controls
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/touch_controls_smoke.gd

      - name: Smoke-test safe Web endpoint policy
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/bridge_endpoint_policy_smoke.gd

      - name: Smoke-test iPad Creator touch gestures
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/creator_touch_gestures_smoke.gd

      - name: Smoke-test family HTTPS session client
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/bridge_family_session_smoke.gd

      - name: Smoke-test first Hero create and save gate
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/creator_new_hero_smoke.gd

      - name: Smoke-test village Hero Creator entrypoint
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/village_creator_entrypoint_smoke.gd

      - name: Smoke-test saved Hero continuity in game and Director
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_saved_hero_game_director_smoke.gd

      - name: Smoke-test shared saved Hero in first 15-second Director scene
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_director_launch_smoke.gd

      - name: Smoke-test same child-owned outfit in game and Director
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_outfit_game_director_smoke.gd

      - name: Smoke-test child wardrobe touch selections
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/creator_touch_wardrobe_smoke.gd

      - name: Smoke-test private saved Hero library and account isolation
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s "$GODOT_BINARY" --headless --path godot --script res://tests/family_hero_library_smoke.gd

      - name: Smoke-test parent-approved short child sessions
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_parent_short_session_smoke.gd

      - name: Smoke-test two saved Heroes and outfits in one film shot
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_two_heroes_director_smoke.gd

      - name: Smoke-test two-Hero cast picker and logout privacy
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_cast_picker_smoke.gd

      - name: Smoke-test parent film consent and approved sibling guest on iPad
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_parent_cast_consent_smoke.gd

      - name: Smoke-test child-editable camera, action and 15/30-second film
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_child_director_choices_smoke.gd

      - name: Smoke-test child-made prop across Play and Director
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_crafted_prop_game_director_smoke.gd

      - name: Smoke-test child iPad private movie saving
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_save_film_ui_smoke.gd

      - name: Smoke-test My Movies resume with owner-verified cast and current equipment
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_reopen_saved_film_smoke.gd

      - name: Smoke-test parent film review and revoke on iPad
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_parent_movie_review_smoke.gd

      - name: Smoke-test child private MP4 two-tap Save and account memory isolation
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_private_movie_download_smoke.gd

      - name: Export Web release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist/web"
          "$GODOT_BINARY" --headless --path godot --export-release "Web" \
            "$GITHUB_WORKSPACE/dist/web/index.html"
          test -s dist/web/index.html
          test -s dist/web/index.wasm
          test -s dist/web/index.pck
          test -s dist/web/index.js

      # A-008: CI-only Creator screenshot build. Do not change the regular
      # Web artifact, route around parent approval, or publish a family URL.
      - name: Export isolated Creator visual-check Web build
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's|^run/main_scene=".*"$|run/main_scene="res://scenes/character_creator.tscn"|' godot/project.godot
          grep -Fx 'run/main_scene="res://scenes/character_creator.tscn"' godot/project.godot
          mkdir -p "$GITHUB_WORKSPACE/dist/creator-visual"
          "$GODOT_BINARY" --headless --path godot --export-release "Web" \
            "$GITHUB_WORKSPACE/dist/creator-visual/index.html"
          test -s dist/creator-visual/index.pck
          test -s dist/creator-visual/index.wasm

      # A-012: synthetic successful-save celebration in a screenshot-only
      # Creator export. Production Web export above remains untouched.
      - name: Export isolated Creator save celebration visual build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("godot/scripts/character_creator_shell.gd")
          source = path.read_text()
          anchor = '    _build_save_celebration()'
          assert source.count(anchor) == 1
          source = source.replace(anchor, anchor + '\n    call_deferred("_ci_saved_hero_preview")', 1)
          source += '''
          func _ci_saved_hero_preview() -> void:
              hero_name_input.text = "小星星 Star"
              character_label.text = "小星星 Star"
              play_button.disabled = false
              _celebrate_saved_hero()
              _set_status("保存成功啦！你的英雄可以去村子玩！", false)
          '''
          path.write_text(source)
          PY
          sed -i -E 's|^run/main_scene=".*"$|run/main_scene="res://scenes/character_creator.tscn"|' godot/project.godot
          mkdir -p dist/creator-celebration-visual
          "$GODOT_BINARY" --headless --path godot --editor --quit
          "$GODOT_BINARY" --headless --path godot --export-release "Web" \
            "$GITHUB_WORKSPACE/dist/creator-celebration-visual/index.html"
          test -s dist/creator-celebration-visual/index.pck

      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/mini-utopia-playwright --no-audit --no-fund playwright@1.56.1
          /tmp/mini-utopia-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Capture Creator on two iPad landscape viewports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/visual-evidence
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/creator-visual >/tmp/mini-utopia-http.log 2>&1 &
          node tools/playwright_creator_visual.cjs
          test -s dist/visual-evidence/creator-1180x820.png
          test -s dist/visual-evidence/creator-1366x1024.png

      # A-012 screenshot-only synthetic OWNED sword versus staff. Production
      # Web export and all smoke tests above remain completely untouched.
      - name: Screenshot owner-scoped hand item swap in isolated Creator builds
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's|^run/main_scene=".*"$|run/main_scene="res://scenes/character_creator.tscn"|' godot/project.godot
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import os

          path = Path("godot/scripts/character_creator_shell.gd")
          # The previous screenshot-only "save celebration" step temporarily
          # edits this same file. Always start from the CHECKED-IN source:
          # these evidence frames must not imply a real save occurred.
          original = subprocess.check_output(
              ["git", "show", "HEAD:godot/scripts/character_creator_shell.gd"],
              text=True,
          )
          anchor = '    _build_save_celebration()'
          assert original.count(anchor) == 1
          for style, label in [
              ("sword_1handed", "剑"),
              ("staff", "法杖"),
          ]:
              source = original.replace(
                  anchor,
                  anchor + '\n    call_deferred("_ci_preview_owned_hand")',
                  1,
              )
              source += f'''
          func _ci_preview_owned_hand() -> void:
              var owned := {{
                  "character_asset_id": "CHAR_CI_OWNED_FIXTURE",
                  "equipped": {{
                      "weapon_main": {{
                          "item_instance_id": "ITEM_CI_OWNED_SWORD",
                          "display_name": "Star Sword",
                          "mesh_asset_id": "sword_1handed",
                          "rarity": "blue",
                      }},
                  }},
                  "final_stats": {{}},
              }}
              _draft_appearance["compatible_tags"] = ["humanoid", "kaykit_style_{style}"]
              avatar_stage.apply_appearance(_draft_appearance)
              avatar_stage.apply_equipment_runtime(owned)
              _set_status("CI合成演示：已拥有的剑 → {label}", false)
          '''
              path.write_text(source)
              subprocess.run(
                  [os.environ["GODOT_BINARY"], "--headless", "--path", "godot", "--editor", "--quit"],
                  check=True,
              )
              target = Path("dist/creator-hand-" + style)
              target.mkdir(parents=True, exist_ok=True)
              subprocess.run(
                  [os.environ["GODOT_BINARY"], "--headless", "--path", "godot",
                   "--export-release", "Web", str(target.resolve() / "index.html")],
                  check=True,
              )
              assert (target / "index.pck").stat().st_size > 0
          path.write_text(original)
          PY
          python3 -m http.server 8775 --bind 127.0.0.1 --directory dist/creator-hand-sword_1handed >/tmp/ci-hand-sword.log 2>&1 &
          python3 -m http.server 8776 --bind 127.0.0.1 --directory dist/creator-hand-staff >/tmp/ci-hand-staff.log 2>&1 &
          node <<'JS'
          const {chromium} = require('/tmp/mini-utopia-playwright/node_modules/playwright');
          const fs = require('node:fs');
          (async () => {
            const browser = await chromium.launch({headless:true,args:[
              '--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--no-sandbox'
            ]});
            try {
