name: Mini Utopia - Godot Web Build

# Stage 1: cloud-built private CI artifacts only.
# Do NOT auto-deploy this public repository to GitHub Pages:
# family content needs a private, authenticated backend first.
on:
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/godot-web-artifact.yml"
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/godot-web-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: "4.7.2"
      GODOT_BINARY: "/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
      TEMPLATE_DIR: "/home/runner/.local/share/godot/export_templates/4.7.2.stable"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot
          curl --fail --location --retry 3 \
            --output /tmp/godot-editor.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot-editor.zip -d /tmp/godot
          chmod +x "$GODOT_BINARY"
          "$GODOT_BINARY" --version

      - name: Restore only the required Web export template
        id: template-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TEMPLATE_DIR }}/web_nothreads_release.zip
          key: mini-utopia-godot-4.7.2-web-nothreads-release-v1

      - name: Download official Web export template on cache miss
        if: steps.template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TEMPLATE_DIR"
          # The upstream .tpz contains all platforms (~1.3 GB), but we
          # extract/cache only the single-threaded Web release template.
          curl --fail --location --retry 3 \
            --output /tmp/godot-templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          unzip -Z1 /tmp/godot-templates.tpz | grep -Fx 'templates/web_nothreads_release.zip'
          unzip -p /tmp/godot-templates.tpz 'templates/web_nothreads_release.zip' \
            > "$TEMPLATE_DIR/web_nothreads_release.zip"
          test -s "$TEMPLATE_DIR/web_nothreads_release.zip"

      - name: Prepare asset imports
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --editor --quit

      - name: Export Web release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist/web"
          "$GODOT_BINARY" --headless --path godot --export-release "Web" \
            "$GITHUB_WORKSPACE/dist/web/index.html"
          test -s dist/web/index.html
          test -s dist/web/index.wasm
          test -s dist/web/index.pck
          test -s dist/web/index.js

      - name: Publish private build artifact for Mac/iPad review
        uses: actions/upload-artifact@v4
        with:
          name: mini-utopia-web-${{ github.sha }}
          path: dist/web/
          if-no-files-found: error
          retention-days: 14
