                  }},
                  "final_stats": {},
              })
              _set_status("CI 合成装备 · 真实 Godot Web", false)

          func _process(_delta: float) -> void:
              if not OS.has_feature("web"):
                  return
              var request := String(JavaScriptBridge.eval(
                  "window.__MU_CLEARANCE_FRAME || ''", true
              ))
              if request.is_empty() or request == _ci_clearance_key:
