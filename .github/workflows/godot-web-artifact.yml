name: Mini Utopia - Godot Web Build

# Stage 1: cloud-built private CI artifacts only.
# Do NOT auto-deploy this public repository to GitHub Pages:
# family content needs a private, authenticated backend first.
on:
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/godot-web-artifact.yml"
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/godot-web-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: "4.7.2"
      GODOT_BINARY: "/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
      TEMPLATE_DIR: "/home/runner/.local/share/godot/export_templates/4.7.2.stable"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot
          curl --fail --location --retry 3 \
            --output /tmp/godot-editor.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot-editor.zip -d /tmp/godot
          chmod +x "$GODOT_BINARY"
          "$GODOT_BINARY" --version

      - name: Restore Web export templates (debug and release)
        id: template-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.TEMPLATE_DIR }}/web_nothreads_release.zip
            ${{ env.TEMPLATE_DIR }}/web_nothreads_debug.zip
          key: mini-utopia-godot-4.7.2-web-nothreads-pair-v2

      - name: Download official Web export templates on cache miss
        if: steps.template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TEMPLATE_DIR"
          # The upstream .tpz contains all platforms (~1.3 GB), but we
          # extract/cache only the single-threaded Web debug/release templates.
          curl --fail --location --retry 3 \
            --output /tmp/godot-templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          for kind in release debug; do
            entry="templates/web_nothreads_${kind}.zip"
            unzip -Z1 /tmp/godot-templates.tpz | grep -Fx "$entry"
            unzip -p /tmp/godot-templates.tpz "$entry" > "$TEMPLATE_DIR/web_nothreads_${kind}.zip"
            test -s "$TEMPLATE_DIR/web_nothreads_${kind}.zip"
          done

      - name: Register Godot export template version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TEMPLATE_DIR"
          printf '%s\n' '4.7.2.stable' > "$TEMPLATE_DIR/version.txt"
          for kind in release debug; do
            test -s "$TEMPLATE_DIR/web_nothreads_${kind}.zip"
            unzip -t "$TEMPLATE_DIR/web_nothreads_${kind}.zip" | tail -n 1
          done

      - name: Prepare asset imports
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --editor --quit

      - name: Smoke-test iPad touch controls
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/touch_controls_smoke.gd

      - name: Smoke-test safe Web endpoint policy
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/bridge_endpoint_policy_smoke.gd

      - name: Smoke-test iPad Creator touch gestures
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/creator_touch_gestures_smoke.gd

      - name: Smoke-test family HTTPS session client
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/bridge_family_session_smoke.gd

      - name: Smoke-test first Hero create and save gate
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/creator_new_hero_smoke.gd

      - name: Smoke-test village Hero Creator entrypoint
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/village_creator_entrypoint_smoke.gd

      - name: Smoke-test saved Hero continuity in game and Director
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_saved_hero_game_director_smoke.gd

      - name: Smoke-test shared saved Hero in first 15-second Director scene
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_director_launch_smoke.gd

      - name: Smoke-test same child-owned outfit in game and Director
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_outfit_game_director_smoke.gd

      - name: Smoke-test child wardrobe touch selections
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/creator_touch_wardrobe_smoke.gd

      - name: Smoke-test private saved Hero library and account isolation
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s "$GODOT_BINARY" --headless --path godot --script res://tests/family_hero_library_smoke.gd

      - name: Smoke-test parent-approved short child sessions
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_parent_short_session_smoke.gd

      - name: Smoke-test two saved Heroes and outfits in one film shot
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_two_heroes_director_smoke.gd

      - name: Smoke-test two-Hero cast picker and logout privacy
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_cast_picker_smoke.gd

      - name: Smoke-test parent film consent and approved sibling guest on iPad
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_parent_cast_consent_smoke.gd

      - name: Smoke-test child-editable camera, action and 15/30-second film
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_child_director_choices_smoke.gd

      - name: Smoke-test child-made prop across Play and Director
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_crafted_prop_game_director_smoke.gd

      - name: Smoke-test child iPad private movie saving
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_save_film_ui_smoke.gd

      - name: Smoke-test My Movies resume with owner-verified cast and current equipment
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_reopen_saved_film_smoke.gd

      - name: Smoke-test parent film review and revoke on iPad
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_parent_movie_review_smoke.gd

      - name: Smoke-test child private MP4 two-tap Save and account memory isolation
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --headless --path godot --script res://tests/family_private_movie_download_smoke.gd

      - name: Export Web release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist/web"
          "$GODOT_BINARY" --headless --path godot --export-release "Web" \
            "$GITHUB_WORKSPACE/dist/web/index.html"
          test -s dist/web/index.html
          test -s dist/web/index.wasm
          test -s dist/web/index.pck
          test -s dist/web/index.js

      # A-008: CI-only Creator screenshot build. Do not change the regular
      # Web artifact, route around parent approval, or publish a family URL.
      - name: Export isolated Creator visual-check Web build
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|run/main_scene="res://scenes/main.tscn"|run/main_scene="res://scenes/character_creator.tscn"|' godot/project.godot
          grep -Fx 'run/main_scene="res://scenes/character_creator.tscn"' godot/project.godot
          mkdir -p "$GITHUB_WORKSPACE/dist/creator-visual"
          "$GODOT_BINARY" --headless --path godot --export-release "Web" \
            "$GITHUB_WORKSPACE/dist/creator-visual/index.html"
          test -s dist/creator-visual/index.pck
          test -s dist/creator-visual/index.wasm

      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/mini-utopia-playwright --no-audit --no-fund playwright@1.56.1
          /tmp/mini-utopia-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Capture Creator on two iPad landscape viewports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/visual-evidence
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/creator-visual >/tmp/mini-utopia-http.log 2>&1 &
          node tools/playwright_creator_visual.cjs
          test -s dist/visual-evidence/creator-1180x820.png
          test -s dist/visual-evidence/creator-1366x1024.png

      # A-009: new source-only CI exports for visual evidence. They use
      # checked-in synthetic session fixtures and never capture family data.
      - name: Export isolated Village and Director visual-check builds
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|run/main_scene="res://scenes/character_creator.tscn"|run/main_scene="res://scenes/main.tscn"|' godot/project.godot
          grep -Fx 'run/main_scene="res://scenes/main.tscn"' godot/project.godot
          mkdir -p "$GITHUB_WORKSPACE/dist/village-visual"
          "$GODOT_BINARY" --headless --path godot --export-release "Web" \
            "$GITHUB_WORKSPACE/dist/village-visual/index.html"
          test -s dist/village-visual/index.pck
          sed -i 's|run/main_scene="res://scenes/main.tscn"|run/main_scene="res://scenes/director_stage.tscn"|' godot/project.godot
          grep -Fx 'run/main_scene="res://scenes/director_stage.tscn"' godot/project.godot
          # The Director requires a validated play session; provide a
          # deterministic SYNTHETIC fixture only for this isolated CI export.
          # The production Web artifact was exported earlier and is unchanged.
          mkdir -p godot/runtime_state
          python3 - <<'PY'
          import json
          from pathlib import Path
          play = json.loads(Path("godot/config/runtime/creator_play_session_example.json").read_text())
          director = {
              "schema_version": "1.0",
              "director_session_id": "DIR_CI_FAKE",
              "episode_id": "EP_CI_FAKE",
              "scene_id": "SCENE_CI_FAKE",
              "shot_id": "SHOT_CI_FAKE",
              "world_asset_id": "LOC_NEWBIE_VILLAGE",
              "duration_seconds": 15.0,
              "animation_intent": "walk",
              "play_session": play,
              "shot": {},
              "camera": {"position": [0.0, 4.2, 7.8], "look_at": [0.0, 1.1, 0.0], "fov": 52.0},
          }
          Path("godot/runtime_state/director_shot_session.json").write_text(json.dumps(director))
          PY
          # Non-imported JSON fixtures must be explicitly included in PCK.
          sed -i 's|include_filter=""|include_filter="runtime_state/*.json"|' godot/export_presets.cfg
          mkdir -p "$GITHUB_WORKSPACE/dist/director-visual"
          "$GODOT_BINARY" --headless --path godot --export-release "Web" \
            "$GITHUB_WORKSPACE/dist/director-visual/index.html"
          test -s dist/director-visual/index.pck

      - name: Capture Village and Director on iPad landscape
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8766 --bind 127.0.0.1 --directory dist/village-visual >/tmp/mini-utopia-village-http.log 2>&1 &
          python3 -m http.server 8767 --bind 127.0.0.1 --directory dist/director-visual >/tmp/mini-utopia-director-http.log 2>&1 &
          MINI_UTOPIA_VISUAL_SCENE=village MINI_UTOPIA_VISUAL_PORT=8766 node tools/playwright_creator_visual.cjs
          MINI_UTOPIA_VISUAL_SCENE=director MINI_UTOPIA_VISUAL_PORT=8767 node tools/playwright_creator_visual.cjs
          test -s dist/visual-evidence/village-1366x1024.png
          test -s dist/visual-evidence/director-1366x1024.png

      # Governance-only evidence: isolated synthetic library builds. Never use
      # household credentials or export this fixture in the production Web PCK.
      - name: Export isolated empty and populated Hero Library visual builds
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|run/main_scene="res://scenes/director_stage.tscn"|run/main_scene="res://scenes/family_hero_library.tscn"|' godot/project.godot
          grep -Fx 'run/main_scene="res://scenes/family_hero_library.tscn"' godot/project.godot
          python3 - <<'PY'
          from pathlib import Path
          path = Path("godot/scripts/family_hero_library.gd")
          source = path.read_text()
          anchor = 'func _family_state() -> MiniUtopiaFamilySceneState:'
          assert source.count(anchor) == 1
          # CI-only injectable fixture: session is synthetic and never sent to a host.
          fixture = '''
          var _ci_visual_state := "chooser"

          func _ci_library_fixture() -> void:
              if _ci_visual_state == "chooser":
                  return
              var family := _family_state()
              if family == null:
                  return
              if not family.connect_family(
                  "https://family.invalid",
                  "CI_FAKE_NON_SECRET_0123456789abcdefghij",
                  "child_a"
              ):
                  return
              if not family.bind_family_client(bridge):
                  return
              _set_connected(true)
              var heroes: Array = []
              if _ci_visual_state == "hero":
                  heroes.append({
                      "character_id": "CHAR_CI_SYNTHETIC",
                      "display_name": "小星星 Star",
                      "profile": {"avatar": {}}
                  })
              _on_bridge_success("characters:list", {
                  "schema_version": "1.0", "characters": heroes
              })
              # The new Lane C first-touch chooser must not cover the
              # library-content evidence once it lands on main.
              var chooser := get_node_or_null("WhoIsPlaying") as Control
              if chooser != null:
                  chooser.hide()

          '''
          source = source.replace(anchor, fixture + anchor, 1)
          ready_end = '        _set_status("想保存新角色？请家长先点「家长入口」。", false)'
          assert source.count(ready_end) == 1
          source = source.replace(ready_end, ready_end + '\n    call_deferred("_ci_library_fixture")', 1)
          path.write_text(source)
          PY
          # Capture the initial two-player chooser before injecting a synthetic
          # owner-scoped session into the other two isolated CI exports.
          for state in chooser empty hero; do
            sed -i -E 's|var _ci_visual_state := "(chooser\|empty\|hero)"|var _ci_visual_state := "'"$state"'"|' godot/scripts/family_hero_library.gd
            "$GODOT_BINARY" --headless --path godot --editor --quit
            mkdir -p "$GITHUB_WORKSPACE/dist/library-$state-visual"
            "$GODOT_BINARY" --headless --path godot --export-release "Web" \
              "$GITHUB_WORKSPACE/dist/library-$state-visual/index.html"
            test -s "dist/library-$state-visual/index.pck"
          done

      - name: Screenshot Who Is Playing and Hero Library at 1180x820
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8768 --bind 127.0.0.1 --directory dist/library-empty-visual >/tmp/mini-utopia-library-empty.log 2>&1 &
          python3 -m http.server 8769 --bind 127.0.0.1 --directory dist/library-hero-visual >/tmp/mini-utopia-library-hero.log 2>&1 &
          python3 -m http.server 8770 --bind 127.0.0.1 --directory dist/library-chooser-visual >/tmp/mini-utopia-chooser.log 2>&1 &
          node <<'JS'
          const {chromium} = require('/tmp/mini-utopia-playwright/node_modules/playwright');
          const fs = require('node:fs');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-webgl', '--no-sandbox']
            });
            try {
              for (const [state, port] of [['who-is-playing', 8770], ['empty', 8768], ['with-hero', 8769]]) {
                const context = await browser.newContext({
                  viewport: {width: 1180, height: 820},
                  deviceScaleFactor: 1, isMobile: true, hasTouch: true
                });
                const page = await context.newPage();
                const errors = [];
                page.on('pageerror', e => errors.push(e.message));
                await page.goto('http://127.0.0.1:' + port + '/', {
                  waitUntil: 'load', timeout: 120000
                });
                await page.locator('canvas').first().waitFor({
                  state: 'visible', timeout: 120000
                });
                await page.waitForFunction(
                  () => document.getElementById('status') === null,
                  null, {timeout: 120000}
                );
                await page.waitForTimeout(5000);
                const file = 'dist/visual-evidence/' + (state === 'who-is-playing' ? state : 'library-' + state) + '-1180x820.png';
                await page.screenshot({path: file, fullPage: false, timeout: 90000});
                if (fs.statSync(file).size < 12000 || errors.length) {
                  throw Error('Invalid library screenshot ' + state + ': ' + errors.join('; '));
                }
                console.log('Captured isolated, synthetic library: ' + file);
                await context.close();
              }
            } finally { await browser.close(); }
          })().catch(e => {console.error(e); process.exitCode = 1;});
          JS
          test -s dist/visual-evidence/who-is-playing-1180x820.png
          test -s dist/visual-evidence/library-empty-1180x820.png
          test -s dist/visual-evidence/library-with-hero-1180x820.png

      - name: Publish iPad Creator visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-ipad-three-scenes-${{ github.sha }}
          path: dist/visual-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish private build artifact for Mac/iPad review
        uses: actions/upload-artifact@v4
        with:
          name: mini-utopia-web-${{ github.sha }}
          path: dist/web/
          if-no-files-found: error
          retention-days: 14
