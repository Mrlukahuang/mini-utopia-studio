name: mini-utopia-family

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/family/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/studio.db
      FAMILY_PRIVATE_MOVIES_ROOT: /movies
      FAMILY_ALLOWED_ORIGINS: https://${FAMILY_LAN_IP:-127.0.0.1}
      FAMILY_PARENT_UNLOCK_SHA256: ${FAMILY_PARENT_UNLOCK_SHA256:?Parent unlock digest required}
      FAMILY_CHILD_A_TOKEN_SHA256: ${FAMILY_CHILD_A_TOKEN_SHA256:?Child A digest required}
      FAMILY_CHILD_B_TOKEN_SHA256: ${FAMILY_CHILD_B_TOKEN_SHA256:?Child B digest required}
    # Only the selected private LAN IPv4. Loopback is the safe CI fallback.
    # No public HTTP:80 and no HTTP/3 UDP exposed.
    ports:
      - "${FAMILY_LAN_IP:-127.0.0.1}:443:443/tcp"
    volumes:
      - family_data:/data
      - ./private-movies:/movies:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    network_mode: "service:api"
    depends_on:
      - api
    environment:
      FAMILY_LAN_IP: ${FAMILY_LAN_IP:-127.0.0.1}
    volumes:
      - ./web:/srv/web:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persistent CA identity and certificates; never export root.key.
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  family_data:
  caddy_data:
  caddy_config:
