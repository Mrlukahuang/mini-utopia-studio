<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#fdf2e9;color:#363b58;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
#canvas{display:block;width:100%;height:100%;outline:0}
#loader{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#fff3e2 0%,#f9dfec 46%,#dceffb 100%);z-index:5;transition:opacity .25s ease}
#loader.hidden{opacity:0;pointer-events:none}
.tile{position:absolute;width:65px;height:65px;border-radius:22px;background:#b9e9d0;opacity:.6;transform:rotate(14deg)}
.tile.a{left:9%;top:16%}.tile.b{right:10%;bottom:18%;background:#d7c1f4;transform:rotate(-18deg)}
.card{position:relative;width:min(420px,85vw);text-align:center;padding:34px 28px;border:2px solid #fff;border-radius:36px;background:rgba(255,255,255,.72);box-shadow:0 16px 36px #645b8730}
.logo{width:158px;height:158px;object-fit:contain;display:block;margin:0 auto 12px}
.brand{font-weight:900;font-size:clamp(27px,5vw,38px);letter-spacing:.02em;margin:0 0 14px}
.tip{font-size:21px;font-weight:700;margin:0 0 23px}
.track{height:22px;border-radius:20px;background:#fff;border:2px solid #e6c9e5;overflow:hidden}
#fill{width:0;height:100%;border-radius:20px;background:linear-gradient(90deg,#b8e6cc,#c9bcf5,#f6b6d2);transition:width .15s ease}
#status{min-height:1.5em;margin:12px 0 0;font-size:14px;color:#555e7a}
#retry{display:none;margin:16px auto 0;padding:12px 24px;border:0;border-radius:18px;background:#b9e9d0;color:#343a56;font-weight:bold;font-size:17px}
@media(prefers-reduced-motion:reduce){#loader,#fill{transition:none}}
</style>
</head>
